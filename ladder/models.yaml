# Model registry. A model spec is "provider/model-name", e.g. "ollama/gpt-oss:20b".
# Prices are $ per million tokens. local: true means data never leaves the machine.
providers:
  ollama:
    base_url: http://localhost:11434/v1
    api_key_env: null
    local: true
    input_per_mtok: 0.0
    output_per_mtok: 0.0
    models:
      # REASONING MODEL. Its chain of thought goes to a separate `reasoning`
      # field and `content` stays EMPTY until it finishes, so completion
      # tokens are mostly deliberation that is then thrown away. Measured
      # 2026-08-24 at DEFAULT effort on a 166-character post: 1,754 reasoning
      # tokens against 75 answer tokens. 96% of the call is discarded.
      #
      # reasoning_effort=low, measured over TEN dev documents, 30 gold
      # reaction mentions, both arms, same prompts:
      #
      #             tokens    sec   gold found
      #   S1 low     1,176     22   19/30  (63%)
      #   S1 default 15,918   320   19/30  (63%)   <- IDENTICAL
      #   S0 low      3,805     77   10/30  (33%)
      #   S0 default 39,426   853   11/30  (37%)   <- one mention
      #
      # S1 loses NOTHING and runs 14x faster. S0 loses one mention of thirty
      # and runs 11x faster. The dev split goes from ~4 hours to ~10 minutes,
      # which is the difference between a measurement that gets rerun and one
      # that does not.
      #
      # THIS REVERSES AN EARLIER DECISION, and the reason it was wrong is the
      # standing rule it broke: `low` was rejected on THREE documents, where
      # it appeared to find 1 gold mention of 17. Three documents cannot
      # measure this. See CLAUDE.md, "config measurements need more than
      # three documents" — written before this, and then not applied.
      #
      # 8000 covers every call that terminates at this effort with room to
      # spare; timeout_s bounds the ones that do not.
      gpt-oss:20b: { max_tokens: 8000, timeout_s: 300, reasoning_effort: low }
      # The rung-4 JUDGE (Phase C, 2026-08-25). BioMistral-7B Q5_K_M — a third
      # local family, domain-adapted to medical text, replacing the 2B
      # granite4:micro-h that was judging a 20B extractor. NON-reasoning
      # Mistral-instruct: the judge reply is one JSON line (smoke test: 39
      # completion tokens), so the budget is small and explicit. No
      # reasoning_effort — the model has no such parameter.
      biomistral:7b-q5_k_m: { max_tokens: 512, timeout_s: 120 }
      # ---- the open-weight extractor comparison (2026-08-28) ----
      # Budgets are per-model registry data, not guesses. qwen3 is a REASONING
      # model in the gpt-oss sense: it deliberates in <think> before answering,
      # so at the 2000-token default it spent the ENTIRE budget thinking and
      # returned truncated=True with EMPTY content on a 166-character post.
      # 8000 matches gpt-oss:20b, which is the only budget in this file that
      # has been shown to let a reasoning model finish.
      qwen3:8b: { max_tokens: 8000, timeout_s: 300 }
      # Non-reasoning instruct models: the answer is one JSON object, and the
      # measured replies are 200-400 completion tokens. 2000 is ample; the
      # timeout is what bounds a runaway.
      llama3.1:8b: { max_tokens: 2000, timeout_s: 180 }
      mistral:7b-instruct: { max_tokens: 2000, timeout_s: 180 }
      # The rung-4 judge, and now also an extractor arm. 3.2B. It failed the
      # RECALL-based extraction path in 2026-08-24 (it answered "AFTERPROMPT");
      # the comparison asks whether retrieve-and-pick, which turns coding into
      # a multiple-choice question, is enough to rescue a model this size.
      ibm/granite4:micro-h: { max_tokens: 2000, timeout_s: 180 }
  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
    local: false
    input_per_mtok: 0.30      # default; override per model below
    output_per_mtok: 2.50
    models:
      gemini-2.5-flash: { input_per_mtok: 0.30, output_per_mtok: 2.50 }
      gemini-2.5-flash-lite: { input_per_mtok: 0.10, output_per_mtok: 0.40 }
      gemini-2.5-pro: { input_per_mtok: 1.25, output_per_mtok: 10.00 }
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    local: false
    input_per_mtok: 0.20
    output_per_mtok: 0.20
  groq:
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    local: false
    input_per_mtok: 0.05
    output_per_mtok: 0.08
  anthropic:
    base_url: https://api.anthropic.com/v1/
    api_key_env: ANTHROPIC_API_KEY
    local: false
    input_per_mtok: 1.00
    output_per_mtok: 5.00
    models:
      claude-haiku-4-5-20251001: { input_per_mtok: 1.00, output_per_mtok: 5.00 }
      # Intro pricing to 2026-08-31 ($3.00/$15.00 after). sampling: false —
      # the Claude 5 family removed temperature/top_p/top_k and returns 400 if
      # one is sent. Every rung here calls with temperature=0, so without this
      # flag the first request fails. See tests/test_llm_registry.py.
      # DECIDED 2026-08-26: the remote extractor arm is an OPTION, never the
      # default. Exercised per run with --extractor anthropic/claude-sonnet-5
      # and LADDER_ALLOW_REMOTE=1 (rung prompts carry CADEC text verbatim, so
      # the remote guard makes that a deliberate act each time). manifest.model
      # stays local. Budget matches the extractor shape (gpt-oss:20b): without
      # it the entry inherits DEFAULT_MAX_TOKENS=2000, the cap that truncated
      # S0/S2 mid-JSON — and Sonnet 5's adaptive thinking bills against the
      # same completion budget. CAVEAT if this arm is ever run: sampling: false
      # means rung 3's sampler has no temperature dial, so its k votes would be
      # near-identical draws — disable rung 3 for the arm or read its numbers
      # as degenerate.
      claude-sonnet-5: { input_per_mtok: 2.00, output_per_mtok: 10.00, sampling: false, max_tokens: 8000, timeout_s: 300 }
      claude-opus-5: { input_per_mtok: 5.00, output_per_mtok: 25.00, sampling: false }
