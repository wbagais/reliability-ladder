# Model registry. A model spec is "provider/model-name", e.g. "ollama/gpt-oss:20b".
# Prices are $ per million tokens. local: true means data never leaves the machine.
providers:
  ollama:
    base_url: http://localhost:11434/v1
    api_key_env: null
    local: true
    input_per_mtok: 0.0
    output_per_mtok: 0.0
    models:
      # REASONING MODEL. It emits a chain of thought before the answer, so the
      # 2000-token default truncates it mid-JSON every time. Measured
      # 2026-08-24 on ARTHROTEC.107: S0 and S2 both returned exactly 2000
      # completion tokens and both were logged parse_failed/json_decode, which
      # is the harness's cap recorded as the model's reliability.
      # REASONING MODEL. Its chain of thought goes to a separate `reasoning`
      # field and `content` stays EMPTY until it finishes, so the budget has
      # to cover the thinking as well as the answer. Measured 2026-08-24 on
      # rung 0's S0 (recall a nine-digit SNOMED id from memory):
      #
      #   default effort, 16000 cap   16000 tokens, content EMPTY, truncated
      #   default effort, 32000 cap    2306 tokens, content OK,      34s
      #   reasoning_effort=medium      8000 tokens, content EMPTY, truncated
      #   reasoning_effort=low          104 tokens, content OK,       2s
      #
      # reasoning_effort is DELIBERATELY UNSET. "low" fixed S0's truncation
      # and cost the thing under measurement. Measured over 3 documents,
      # 17 gold reaction mentions:
      #
      #                        S0    S1    S2   tok_out    sec
      #   effort=low  cap 8k    1    10     9      ~900     ~1
      #   default     cap 32k  11    12    13   5.8-28.6k  106-539
      #
      # S0 finds ONE mention of seventeen at low effort — that is not a
      # speed-up, it is a different experiment. And scope must be identical
      # across S0/S1/S2 or their comparison means nothing, so the effort
      # cannot differ per step either. The cost is real and is reported: the
      # dev split takes hours, not minutes.
      gpt-oss:20b: { max_tokens: 32000 }
  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
    local: false
    input_per_mtok: 0.30      # default; override per model below
    output_per_mtok: 2.50
    models:
      gemini-2.5-flash: { input_per_mtok: 0.30, output_per_mtok: 2.50 }
      gemini-2.5-flash-lite: { input_per_mtok: 0.10, output_per_mtok: 0.40 }
      gemini-2.5-pro: { input_per_mtok: 1.25, output_per_mtok: 10.00 }
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    local: false
    input_per_mtok: 0.20
    output_per_mtok: 0.20
  groq:
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    local: false
    input_per_mtok: 0.05
    output_per_mtok: 0.08
  anthropic:
    base_url: https://api.anthropic.com/v1/
    api_key_env: ANTHROPIC_API_KEY
    local: false
    input_per_mtok: 1.00
    output_per_mtok: 5.00
    models:
      claude-haiku-4-5-20251001: { input_per_mtok: 1.00, output_per_mtok: 5.00 }
      # Intro pricing to 2026-08-31 ($3.00/$15.00 after). sampling: false —
      # the Claude 5 family removed temperature/top_p/top_k and returns 400 if
      # one is sent. Every rung here calls with temperature=0, so without this
      # flag the first request fails. See tests/test_llm_registry.py.
      claude-sonnet-5: { input_per_mtok: 2.00, output_per_mtok: 10.00, sampling: false }
      claude-opus-5: { input_per_mtok: 5.00, output_per_mtok: 25.00, sampling: false }
