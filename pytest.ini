# Registering the marker is what makes `-m "not integration"` meaningful.
# Without it pytest warns and, worse, the marker deselects nothing — which is
# how the integration tests came to run in CI, where there is no corpus, no
# vocabulary index and no model, and failed for reasons that said nothing
# about the code.
[pytest]
markers =
    integration: needs the licensed corpus, the SNOMED index and a reachable model. Skips when any is absent; CI deselects them.
